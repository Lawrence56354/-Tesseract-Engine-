<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multi-Shape 4D Space Engine</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            background-color: #111;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #canvas-container {
            width: 100%;
            height: 60%;
            background: #000;
            position: relative;
        }
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #scroll-wrapper {
            width: 100%;
            height: 40%;
            overflow-y: scroll;
            background: #1a1a1a;
            border-top: 2px solid #333;
        }
        #controls {
            width: 100%;
            padding: 6px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
        }
        #shape-select {
            grid-column: span 4;
            background: #2b6cb0;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
            margin-bottom: 4px;
            text-align: center;
        }
        #shape-select option {
            background: #222;
            color: #fff;
        }
        button {
            background: #383838;
            color: #fff;
            border: none;
            padding: 10px 2px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-family: monospace;
            font-weight: bold;
        }
        button:hover {
            background: #4a4a4a;
        }
        button:active {
            background: #00ffcc;
            color: #000;
        }
        .label {
            grid-column: span 4;
            text-align: center;
            font-size: 10px;
            color: #00ffcc;
            padding: 4px 0;
            background: #222;
            border-radius: 3px;
            margin-top: 4px;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="canvas"></canvas>
    </div>
    
    <div id="scroll-wrapper">
        <div id="controls">
            <select id="shape-select" onchange="changeShape(this.value)">
                <option value="cube">📦 ACTIVE HYPER-GEOMETRY: CUBE (TESSERACT)</option>
                <option value="triangle">🔺 ACTIVE HYPER-GEOMETRY: TRIANGLE PRISM</option>
                <option value="sphere">🌐 ACTIVE HYPER-GEOMETRY: SPHERE (HYPERSPHERE)</option>
                <option value="hexagon">⬢ ACTIVE HYPER-GEOMETRY: HEXAGON HYPERPRISM</option>
                <option value="octagon">🛑 ACTIVE HYPER-GEOMETRY: OCTAGON HYPERPRISM</option>
            </select>

            <div class="label" style="margin-top:0;">3D MOVE KEYS</div>
            <button onclick="position.x -= 0.15">← X</button>
            <button onclick="position.x += 0.15">X →</button>
            <button onclick="position.y -= 0.15">↑ Y</button>
            <button onclick="position.y += 0.15">Y ↓</button>
            
            <button onclick="position.z += 0.15">In Z</button>
            <button onclick="position.z -= 0.15">Out Z</button>
            <button onclick="resetPosition()" style="grid-column: span 2; background: #555;">Reset Geometry</button>

            <div class="label">4D W-SHIFT CONTROLS</div>
            <button onclick="position.w += 0.15" style="grid-column: span 2; background:#0284c7;">+W Shift</button>
            <button onclick="position.w -= 0.15" style="grid-column: span 2; background:#0284c7;">-W Shift</button>

            <div class="label">4D PLANE ROTATIONS</div>
            <button onclick="angles.xw += 0.15">XW L</button>
            <button onclick="angles.xw -= 0.15">XW R</button>
            <button onclick="angles.yw += 0.15">YW L</button>
            <button onclick="angles.yw -= 0.15">YW R</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let vertices = [];
        let edges = [];
        let position = { x: 0, y: 0, z: 0, w: 0 };
        let angles = { xw: 0, yw: 0, zw: 0, xy: 0.3, xz: 0.3 };
        let currentShapeType = "cube";

        function resize() {
            canvas.width = canvas.clientWidth || 480;
            canvas.height = canvas.clientHeight || 240;
        }
        window.addEventListener('resize', resize);
        window.addEventListener('load', resize);
        setTimeout(resize, 100);

        function generateShape(type) {
            vertices = [];
            edges = [];
            currentShapeType = type;

            if (type === "cube") {
                for (let x of [-1, 1]) {
                    for (let y of [-1, 1]) {
                        for (let z of [-1, 1]) {
                            for (let w of [-1, 1]) {
                                vertices.push({x, y, z, w});
                            }
                        }
                    }
                }
                for (let i = 0; i < vertices.length; i++) {
                    for (let j = i + 1; j < vertices.length; j++) {
                        let diff = 0;
                        if (vertices[i].x !== vertices[j].x) diff++;
                        if (vertices[i].y !== vertices[j].y) diff++;
                        if (vertices[i].z !== vertices[j].z) diff++;
                        if (vertices[i].w !== vertices[j].w) diff++;
                        if (diff === 1) edges.push([i, j]);
                    }
                }
            } 
            else if (type === "triangle") {
                vertices = [
                    {x: 0, y: -1, z: -0.5, w: -0.5},
                    {x: -0.86, y: 0.5, z: -0.5, w: -0.5},
                    {x: 0.86, y: 0.5, z: -0.5, w: -0.5},
                    {x: 0, y: -1, z: 1, w: -0.5},
                    {x: -0.86, y: 0.5, z: 1, w: -0.5},
                    {x: 0.86, y: 0.5, z: 1, w: -0.5}
                ];
                let len = vertices.length;
                for (let i = 0; i < len; i++) {
                    vertices.push({x: vertices[i].x, y: vertices[i].y, z: vertices[i].z, w: 1});
                }
                for (let i = 0; i < vertices.length; i++) {
                    for (let j = i + 1; j < vertices.length; j++) {
                        edges.push([i, j]);
                    }
                }
            } 
            else if (type === "sphere") {
                let steps = 6;
                for (let i = 0; i < steps; i++) {
                    let lat = (i / (steps - 1)) * Math.PI - Math.PI / 2;
                    for (let j = 0; j < steps * 2; j++) {
                        let lon = (j / (steps * 2)) * 2 * Math.PI;
                        for (let wOfs of [-0.6, 0.6]) {
                            let x = Math.cos(lat) * Math.cos(lon);
                            let y = Math.cos(lat) * Math.sin(lon);
                            let z = Math.sin(lat);
                            vertices.push({x, y, z, w: wOfs});
                        }
                    }
                }
                for (let i = 0; i < vertices.length; i += 2) {
                    if (i + 1 < vertices.length) edges.push([i, i + 1]);
                    if (i + 2 < vertices.length) edges.push([i, i + 2]);
                }
            }
            else if (type === "hexagon" || type === "octagon") {
                let sides = type === "hexagon" ? 6 : 8;
                for (let theta = 0; theta < sides; theta++) {
                    let angle = (theta / sides) * 2 * Math.PI;
                    let x = Math.cos(angle);
                    let y = Math.sin(angle);
                    for (let z of [-0.8, 0.8]) {
                        for (let w of [-0.8, 0.8]) {
                            vertices.push({x, y, z, w});
                        }
                    }
                }
                for (let i = 0; i < vertices.length; i++) {
                    for (let j = i + 1; j < vertices.length; j++) {
                        let dist = Math.hypot(vertices[i].x - vertices[j].x, vertices[i].y - vertices[j].y, vertices[i].z - vertices[j].z, vertices[i].w - vertices[j].w);
                        if (dist < 1.2) edges.push([i, j]);
                    }
                }
            }
        }

        function changeShape(shapeVal) {
            generateShape(shapeVal);
        }

        function resetPosition() {
            position = { x: 0, y: 0, z: 0, w: 0 };
            angles = { xw: 0, yw: 0, zw: 0, xy: 0.3, xz: 0.3 };
        }

        function rotateXW(p, angle) {
            let cos = Math.cos(angle), sin = Math.sin(angle);
            return { x: p.x * cos - p.w * sin, y: p.y, z: p.z, w: p.x * sin + p.w * cos };
        }
        function rotateYW(p, angle) {
            let cos = Math.cos(angle), sin = Math.sin(angle);
            return { x: p.x, y: p.y * cos - p.w * sin, z: p.z, w: p.y * sin + p.w * cos };
        }
        function rotateXY(p, angle) {
            let cos = Math.cos(angle), sin = Math.sin(angle);
            return { x: p.x * cos - p.y * sin, y: p.x * sin + p.y * cos, z: p.z, w: p.w };
        }

        function loop() {
            if (canvas.width === 0 || canvas.height === 0) resize();

            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            angles.xy += 0.004;

            if (position.w > 1.8) position.w = 1.8;
            if (position.w < -1.8) position.w = -1.8;

            const projected2D = [];
            const cx = canvas.width / 2;
const cy = canvas.height / 2;
vertices.forEach(v => {
let p = rotateXW(v, angles.xw);
p = rotateYW(p, angles.yw);
p = rotateXY(p, angles.xy);
let x = p.x + position.x;
let y = p.y + position.y;
let z = p.z + position.z;
let w = p.w + position.w;
let factor4D = 1 / (3.2 - w);
let x3d = x * factor4D;
let y3d = y * factor4D;
let z3d = z * factor4D;
let factor2D = 1 / (2.6 - z3d);
let minDim = Math.min(canvas.width, canvas.height);
let screenX = cx + x3d * factor2D * minDim * 0.52;
let screenY = cy + y3d * factor2D * minDim * 0.52;
projected2D.push({x: screenX, y: screenY, w: w});
});
edges.forEach(edge => {
// FIXED INDICES: Pull elements explicitly from array indexes
const p1 = projected2D[edge[0]];
const p2 = projected2D[edge[1]];
if (!p1 || !p2) return;
const avgW = (p1.w + p2.w) / 2;
const brightness = Math.floor((avgW + 2) * 50);
ctx.beginPath();
ctx.moveTo(p1.x, p1.y);
ctx.lineTo(p2.x, p2.y);
if (currentShapeType === 'sphere') {
ctx.strokeStyle = rgba(56, 189, 248, 0.45);
} else {
ctx.strokeStyle = rgb(0, ${Math.min(255, Math.max(100, brightness + 100))}, ${Math.min(255, Math.max(150, brightness + 180))});
}
ctx.lineWidth = currentShapeType === 'sphere' ? 0.8 : 1.4;
ctx.stroke();
});
ctx.fillStyle = '#00ffcc';
ctx.font = '10px monospace';
ctx.fillText(W-Pos: ${position.w.toFixed(2)}, 10, 20);
requestAnimationFrame(loop);
}
generateShape("cube");
loop();

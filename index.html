<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>4D Tesseract Space Engine</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            background-color: #111;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #canvas-container {
            width: 100%;
            height: 65%; /* Hardcodes the exact screen footprint for the rendering view */
            background: #000;
            position: relative;
        }
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* SCROLL PANEL WRAPPER */
        #scroll-wrapper {
            width: 100%;
            height: 35%; /* Fixed footprint allocation for buttons */
            overflow-y: scroll; /* Forces scrolling capability permanently */
            background: #1a1a1a;
            border-top: 2px solid #333;
        }
        #controls {
            width: 100%;
            padding: 6px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
        }
        button {
            background: #383838;
            color: #fff;
            border: none;
            padding: 10px 2px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-family: monospace;
            font-weight: bold;
        }
        button:hover {
            background: #4a4a4a;
        }
        button:active {
            background: #00ffcc;
            color: #000;
        }
        .label {
            grid-column: span 4;
            text-align: center;
            font-size: 10px;
            color: #00ffcc;
            padding: 4px 0;
            background: #222;
            border-radius: 3px;
            margin-top: 4px;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="canvas"></canvas>
    </div>
    
    <div id="scroll-wrapper">
        <div id="controls">
            <div class="label" style="margin-top:0;">3D MOVE KEYS</div>
            <button onclick="position.x -= 0.15">← X</button>
            <button onclick="position.x += 0.15">X →</button>
            <button onclick="position.y -= 0.15">↑ Y</button>
            <button onclick="position.y += 0.15">Y ↓</button>
            
            <button onclick="position.z += 0.15">In Z</button>
            <button onclick="position.z -= 0.15">Out Z</button>
            <button onclick="resetPosition()" style="grid-column: span 2; background: #555;">Reset Cube</button>

            <div class="label">4D W-SHIFT CONTROLS</div>
            <button onclick="position.w += 0.15" style="grid-column: span 2; background:#0284c7;">+W Shift</button>
            <button onclick="position.w -= 0.15" style="grid-column: span 2; background:#0284c7;">-W Shift</button>

            <div class="label">4D PLANE ROTATIONS</div>
            <button onclick="angles.xw += 0.15">XW L</button>
            <button onclick="angles.xw -= 0.15">XW R</button>
            <button onclick="angles.yw += 0.15">YW L</button>
            <button onclick="angles.yw -= 0.15">YW R</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = canvas.clientWidth || 480;
            canvas.height = canvas.clientHeight || 240;
        }
        window.addEventListener('resize', resize);
        window.addEventListener('load', resize);
        // Step latency adjustments ensure safe sizing parameters are calculated
        setTimeout(resize, 50);
        setTimeout(resize, 300);

        let vertices = [];
        for (let x of [-1, 1]) {
            for (let y of [-1, 1]) {
                for (let z of [-1, 1]) {
                    for (let w of [-1, 1]) {
                        vertices.push({x, y, z, w});
                    }
                }
            }
        }

        let position = { x: 0, y: 0, z: 0, w: 0 };
        let angles = { xw: 0, yw: 0, zw: 0, xy: 0.3, xz: 0.3 };

        function resetPosition() {
            position = { x: 0, y: 0, z: 0, w: 0 };
            angles = { xw: 0, yw: 0, zw: 0, xy: 0.3, xz: 0.3 };
        }

        const edges = [];
        for (let i = 0; i < vertices.length; i++) {
            for (let j = i + 1; j < vertices.length; j++) {
                let diff = 0;
                if (vertices[i].x !== vertices[j].x) diff++;
                if (vertices[i].y !== vertices[j].y) diff++;
                if (vertices[i].z !== vertices[j].z) diff++;
                if (vertices[i].w !== vertices[j].w) diff++;
                if (diff === 1) edges.push([i, j]);
            }
        }

        function rotateXW(p, angle) {
            let cos = Math.cos(angle), sin = Math.sin(angle);
            return { x: p.x * cos - p.w * sin, y: p.y, z: p.z, w: p.x * sin + p.w * cos };
        }
        function rotateYW(p, angle) {
            let cos = Math.cos(angle), sin = Math.sin(angle);
            return { x: p.x, y: p.y * cos - p.w * sin, z: p.z, w: p.y * sin + p.w * cos };
        }
        function rotateXY(p, angle) {
            let cos = Math.cos(angle), sin = Math.sin(angle);
            return { x: p.x * cos - p.y * sin, y: p.x * sin + p.y * cos, z: p.z, w: p.w };
        }

        function loop() {
            if (canvas.width === 0 || canvas.height === 0) resize();

            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            angles.xy += 0.005; // Standard 3D structural back-spin

            // Clamp positions to avoid infinite distortion anomalies
            if (position.w > 1.8) position.w = 1.8;
            if (position.w < -1.8) position.w = -1.8;

            const projected2D = [];
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            vertices.forEach(v => {
                let p = rotateXW(v, angles.xw);
                p = rotateYW(p, angles.yw);
                p = rotateXY(p, angles.xy);

                let x = p.x + position.x;
                let y = p.y + position.y;
                let z = p.z + position.z;
                let w = p.w + position.w;

                let factor4D = 1 / (3.0 - w);
                let x3d = x * factor4D;
                let y3d = y * factor4D;
                let z3d = z * factor4D;

                let factor2D = 1 / (2.5 - z3d);
                let minDim = Math.min(canvas.width, canvas.height);
                let screenX = cx + x3d * factor2D * minDim * 0.5;
                let screenY = cy + y3d * factor2D * minDim * 0.5;

                projected2D.push({x: screenX, y: screenY, w: w});
            });

            edges.forEach(edge => {
                const p1 = projected2D[edge];
                const p2 = projected2D[edge];
                if (!p1 || !p2) return;
                
                const avgW = (p1.w + p2.w) / 2;
                const brightness = Math.floor((avgW + 2) * 50);
                
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = `rgb(0, ${Math.min(255, Math.max(100, brightness + 100))}, ${Math.min(255, Math.max(150, brightness + 180))})`;
                ctx.lineWidth = 1.5;
                ctx.stroke();
            });

            ctx.fillStyle = '#00ffcc';
            ctx.font = '10px monospace';
            ctx.fillText(`W-Pos: ${position.w.toFixed(2)}`, 10, 20);

            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>

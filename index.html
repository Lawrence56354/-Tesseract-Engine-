<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>4D Tesseract Space Engine</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            color: #eee;
            font-family: monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #canvas {
            display: block;
            background: #000;
            width: 100%;
            max-width: 480px;
            height: 240px;
        }
        #controls {
            width: 100%;
            max-width: 480px;
            padding: 10px;
            background: #222;
            box-sizing: border-box;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }
        button {
            background: #444;
            color: #fff;
            border: none;
            padding: 8px 4px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-family: monospace;
        }
        button:hover {
            background: #555;
        }
        button:active {
            background: #00ffcc;
            color: #000;
        }
        .label {
            grid-column: span 4;
            text-align: center;
            font-size: 11px;
            color: #00ffcc;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>
    
    <div id="controls">
        <div class="label">3D MOVE / 4D W-SHIFT</div>
        <button onclick="position.x -= 0.1">← X</button>
        <button onclick="position.x += 0.1">X →</button>
        <button onclick="position.y -= 0.1">↑ Y</button>
        <button onclick="position.y += 0.1">Y ↓</button>
        
        <button onclick="position.z += 0.1">In Z</button>
        <button onclick="position.z -= 0.1">Out Z</button>
        <button onclick="position.w += 0.1" style="background:#0284c7;">+W Shift</button>
        <button onclick="position.w -= 0.1" style="background:#0284c7;">-W Shift</button>

        <div class="label">4D ROTATIONS (SPIN PLANES)</div>
        <button onclick="angles.xw += 0.1">XW L</button>
        <button onclick="angles.xw -= 0.1">XW R</button>
        <button onclick="angles.yw += 0.1">YW L</button>
        <button onclick="angles.yw -= 0.1">YW R</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 480;
        canvas.height = 240;

        let vertices = [];
        for (let x of [-1, 1]) {
            for (let y of [-1, 1]) {
                for (let z of [-1, 1]) {
                    for (let w of [-1, 1]) {
                        vertices.push({x, y, z, w});
                    }
                }
            }
        }

        let position = { x: 0, y: 0, z: 0, w: 0 };
        let angles = { xw: 0, yw: 0, zw: 0, xy: 0.3, xz: 0.3 };

        const edges = [];
        for (let i = 0; i < vertices.length; i++) {
            for (let j = i + 1; j < vertices.length; j++) {
                let diff = 0;
                if (vertices[i].x !== vertices[j].x) diff++;
                if (vertices[i].y !== vertices[j].y) diff++;
                if (vertices[i].z !== vertices[j].z) diff++;
                if (vertices[i].w !== vertices[j].w) diff++;
                if (diff === 1) edges.push([i, j]);
            }
        }

        function rotateXW(p, angle) {
            let cos = Math.cos(angle), sin = Math.sin(angle);
            return { x: p.x * cos - p.w * sin, y: p.y, z: p.z, w: p.x * sin + p.w * cos };
        }
        function rotateYW(p, angle) {
            let cos = Math.cos(angle), sin = Math.sin(angle);
            return { x: p.x, y: p.y * cos - p.w * sin, z: p.z, w: p.y * sin + p.w * cos };
        }
        function rotateXY(p, angle) {
            let cos = Math.cos(angle), sin = Math.sin(angle);
            return { x: p.x * cos - p.y * sin, y: p.x * sin + p.y * cos, z: p.z, w: p.w };
        }

        function loop() {
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            angles.xy += 0.005; // Constant default rotation

            const projected2D = [];
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            vertices.forEach(v => {
                let p = rotateXW(v, angles.xw);
                p = rotateYW(p, angles.yw);
                p = rotateXY(p, angles.xy);

                let x = p.x + position.x;
                let y = p.y + position.y;
                let z = p.z + position.z;
                let w = p.w + position.w;

                let factor4D = 1 / (3 - w);
                let x3d = x * factor4D;
                let y3d = y * factor4D;
                let z3d = z * factor4D;

                let factor2D = 1 / (2 - z3d);
                let screenX = cx + x3d * factor2D * canvas.width * 0.4;
                let screenY = cy + y3d * factor2D * canvas.width * 0.4;

                projected2D.push({x: screenX, y: screenY, w: w});
            });

            edges.forEach(edge => {
                const p1 = projected2D[edge[0]];
                const p2 = projected2D[edge[1]];
                const avgW = (p1.w + p2.w) / 2;
                const brightness = Math.floor((avgW + 2) * 50);
                
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = `rgb(0, ${Math.min(255, Math.max(100, brightness + 100))}, ${Math.min(255, Math.max(150, brightness + 180))})`;
                ctx.lineWidth = 1.5;
                ctx.stroke();
            });

            ctx.fillStyle = '#00ffcc';
            ctx.font = '10px monospace';
            ctx.fillText(`W-Pos: ${position.w.toFixed(2)}`, 10, 20);

            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
